[project]
name = "foreign-trade-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "ddgs>=9.0.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.32.0"]
